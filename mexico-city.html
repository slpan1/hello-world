<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mexico City Area Guide</title>
<style>
  :root{
    --bg:#f6efe4; --paper:#fbf6ee; --panel:#ffffff; --line:#e4d7c3; --line2:#d6c4a8;
    --ink:#2f2a24; --ink2:#6b5f52; --muted:#96897a;
    --accent:#c2410c; --accent2:#0d7f7a; --gold:#b7791f; --rose:#be3455;
    --shadow:0 6px 22px rgba(90,66,38,.13);
    --shadow-sm:0 2px 8px rgba(90,66,38,.10);
    --water:#a8cfd8; --road:#ffffff; --road2:#f0dcc0;
    --panelW:392px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}

  /* ---------- shell ---------- */
  .app{display:flex;flex-direction:column;height:100dvh;width:100%}
  header{display:flex;align-items:center;gap:12px;padding:10px 14px;
    background:linear-gradient(100deg,#0f766e 0%,#166b5c 42%,#b45309 100%);
    color:#fff;box-shadow:0 3px 14px rgba(60,40,20,.22);z-index:30;flex:none}
  .brand{display:flex;align-items:baseline;gap:9px;min-width:0}
  .brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
  .brand .sub{font-size:11.5px;color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .head-sp{flex:1}
  .viewtabs{display:flex;background:rgba(0,0,0,.20);border-radius:999px;padding:3px;gap:2px;flex:none}
  .viewtabs button{background:none;border:0;color:rgba(255,255,255,.80);font-size:12.5px;font-weight:600;
    padding:6px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.15s}
  .viewtabs button.on{background:rgba(255,255,255,.95);color:#0f4c46;box-shadow:0 1px 4px rgba(0,0,0,.18)}
  .iconbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);color:#fff;
    width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:15px;line-height:1;flex:none}
  .iconbtn:hover{background:rgba(255,255,255,.28)}

  .body{flex:1;display:flex;min-height:0;position:relative}

  /* ---------- map ---------- */
  .mapwrap{flex:1;position:relative;min-width:0;background:var(--bg);overflow:hidden;touch-action:none}
  svg#map{display:block;width:100%;height:100%;cursor:grab;background:
    radial-gradient(120% 90% at 50% 0%,#fdf8f0 0%,#f2e8d8 55%,#e9dcc6 100%)}
  svg#map.drag{cursor:grabbing}
  .cell{stroke:#fff;stroke-width:1.1;cursor:pointer;transition:fill-opacity .12s,filter .12s}
  .cell:hover{fill-opacity:.98;filter:brightness(1.06)}
  .cell.sel{stroke:#2f2a24;stroke-width:2.2}
  .cell.dim{fill-opacity:.42}
  .boundary{fill:none;stroke:#b09a78;stroke-width:1.6;stroke-dasharray:6 4;opacity:.85}
  .road{fill:none;stroke:var(--road);stroke-linecap:round;stroke-linejoin:round;opacity:.92;pointer-events:none}
  .road-case{fill:none;stroke:rgba(150,120,80,.28);stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .feat{pointer-events:none}
  .canal{fill:none;stroke:var(--water);stroke-width:1.4;opacity:.9}

  /* screen-space overlay layers */
  .lbl{font-size:11px;font-weight:650;fill:#463b2e;paint-order:stroke fill;
    stroke:rgba(255,252,246,.92);stroke-width:3.4px;stroke-linejoin:round;pointer-events:none;text-anchor:middle}
  .lbl.big{font-size:12.5px}
  .lbl.sm{font-size:9.7px;fill:#6b5f52;font-weight:600}
  .lbl.park{fill:#2f6b3f;stroke:rgba(255,255,255,.85)}
  .lbl.sel{fill:#111;font-weight:800}
  .pin{cursor:pointer}
  .pin circle.dot{stroke:#fff;stroke-width:1.6}
  .pin text.gl{font-size:9px;text-anchor:middle;dominant-baseline:central;pointer-events:none;fill:#fff;font-weight:700}
  .pin.sel circle.dot{stroke:#2f2a24;stroke-width:2.4}
  .pin .halo{fill:none;stroke:rgba(0,0,0,.10);stroke-width:6}

  /* ---------- map controls ---------- */
  .ctl{position:absolute;display:flex;flex-direction:column;gap:6px;z-index:12}
  .ctl.zoom{right:12px;bottom:96px}
  .ctl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.94);
    box-shadow:var(--shadow-sm);cursor:pointer;font-size:16px;font-weight:700;color:var(--ink2);backdrop-filter:blur(4px)}
  .ctl button:hover{background:#fff;color:var(--ink)}
  .ctl button.small{font-size:11px;font-weight:600}

  .filters{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:12;pointer-events:none}
  .filters .chip{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);
    border:1px solid var(--line2);border-radius:999px;padding:5px 11px 5px 7px;font-size:12px;font-weight:600;color:var(--ink2);
    cursor:pointer;box-shadow:var(--shadow-sm);backdrop-filter:blur(6px);transition:.13s;white-space:nowrap}
  .filters .chip .sw{width:14px;height:14px;border-radius:50%;display:inline-grid;place-items:center;font-size:8px;color:#fff;font-weight:700}
  .filters .chip.off{opacity:.44;background:rgba(255,255,255,.62)}
  .filters .chip:hover{border-color:var(--ink2)}

  .legend{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.93);border:1px solid var(--line2);
    border-radius:12px;padding:9px 11px;box-shadow:var(--shadow-sm);z-index:12;backdrop-filter:blur(6px);max-width:min(300px,60vw)}
  .legend h4{margin:0 0 6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .legend .rows{display:flex;flex-wrap:wrap;gap:4px 12px}
  .legend .r{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2)}
  .legend .r i{width:11px;height:11px;border-radius:3px;display:block;border:1px solid rgba(0,0,0,.10)}
  .legend .hint{margin-top:7px;font-size:10.5px;color:var(--muted);line-height:1.35}
  .legend.collapsed .rows,.legend.collapsed .hint{display:none}
  .legend h4 span{float:right;cursor:pointer;color:var(--ink2);font-size:11px;margin-left:10px}

  .tip{position:absolute;z-index:20;background:rgba(30,25,20,.93);color:#fff;font-size:11.5px;padding:5px 9px;
    border-radius:7px;pointer-events:none;transform:translate(-50%,-140%);white-space:nowrap;opacity:0;transition:opacity .1s;
    box-shadow:0 4px 12px rgba(0,0,0,.25);max-width:240px}
  .tip.on{opacity:1}
  .tip b{font-weight:700}
  .tip i{font-style:normal;color:#ffd7a8}

  /* ---------- panel ---------- */
  .panel{width:var(--panelW);flex:none;background:var(--paper);border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;z-index:15;box-shadow:-8px 0 24px rgba(90,66,38,.07)}
  .search{padding:11px 12px 9px;border-bottom:1px solid var(--line);position:relative;background:var(--paper)}
  .search input{width:100%;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:9px 32px 9px 32px;
    font-size:13.5px;color:var(--ink);outline:none}
  .search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
  .search input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(13,127,122,.13)}
  .search .mag{position:absolute;left:22px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
  .search .clr{position:absolute;right:20px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);
    cursor:pointer;font-size:15px;display:none;padding:2px 4px}
  .search.has .clr{display:block}
  .results{position:absolute;left:12px;right:12px;top:52px;background:#fff;border:1px solid var(--line2);border-radius:12px;
    box-shadow:var(--shadow);max-height:min(58vh,420px);overflow:auto;z-index:40;display:none}
  .results.on{display:block}
  .results .res{display:flex;gap:9px;align-items:center;padding:9px 11px;cursor:pointer;border-bottom:1px solid #f3ece1}
  .results .res:last-child{border-bottom:0}
  .results .res:hover,.results .res.act{background:#fdf5e9}
  .results .res .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;color:#fff;flex:none}
  .results .res .t{font-size:13px;font-weight:600;line-height:1.25}
  .results .res .s{font-size:11px;color:var(--muted)}
  .results .none{padding:14px;font-size:12.5px;color:var(--muted);text-align:center}

  .ptabs{display:flex;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--line);background:var(--paper)}
  .ptabs button{border:0;background:none;padding:7px 11px 9px;font-size:12.5px;font-weight:650;color:var(--muted);
    cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
  .ptabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .pbody{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .pad{padding:14px}

  .hero{padding:15px 14px 13px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff 0%,var(--paper) 100%)}
  .hero .kicker{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .hero h2{margin:3px 0 5px;font-size:21px;line-height:1.15;font-weight:750;letter-spacing:-.2px}
  .hero .sub{font-size:12px;color:var(--ink2)}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .tag{font-size:11px;background:#f2e9da;border:1px solid var(--line);color:var(--ink2);border-radius:999px;padding:3px 9px;font-weight:600}
  .tag.k{background:rgba(13,127,122,.10);border-color:rgba(13,127,122,.25);color:#0b6560}
  .desc{font-size:13.5px;color:var(--ink);line-height:1.55}
  .desc p{margin:0 0 10px}
  .facts{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin:12px 0 0;font-size:12.5px;align-items:start}
  .facts dt{color:var(--muted);font-weight:650;white-space:nowrap}
  .facts dd{margin:0;color:var(--ink2)}
  .sec{margin-top:16px}
  .sec h3{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;gap:8px}
  .sec h3:after{content:"";flex:1;height:1px;background:var(--line)}
  .item{display:flex;gap:10px;padding:9px;border:1px solid var(--line);background:#fff;border-radius:11px;
    margin-bottom:7px;cursor:pointer;transition:.12s;box-shadow:0 1px 3px rgba(90,66,38,.05)}
  .item:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
  .item .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;color:#fff;flex:none;margin-top:1px}
  .item .t{font-size:13px;font-weight:650;line-height:1.3}
  .item .d{font-size:11.5px;color:var(--ink2);line-height:1.4;margin-top:2px}
  .item .m{font-size:10.5px;color:var(--muted);margin-top:3px}
  .stars{color:var(--gold);font-size:11px;letter-spacing:1px}
  .empty{font-size:12.5px;color:var(--muted);padding:10px 2px}
  .backlink{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--accent2);cursor:pointer;font-weight:650;
    background:none;border:0;padding:0;margin-bottom:8px}
  .backlink:hover{text-decoration:underline}
  .arealist .item .t{font-weight:700}
  .grp{margin-bottom:14px}
  .grp h4{margin:0 0 7px;font-size:12px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:7px}
  .grp h4 i{width:11px;height:11px;border-radius:3px;display:block}
  .note{background:#fff8ec;border:1px solid #f0dcbb;border-radius:10px;padding:10px 11px;font-size:12px;color:#7a5a20;line-height:1.5}
  .note b{color:#5d4413}
  .foot{padding:12px 14px 30px;font-size:11px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);margin-top:14px}

  .sheet-grip{display:none}
  /* ---------- mobile ---------- */
  @media (max-width:860px){
    .app{height:100dvh}
    .body{flex-direction:column}
    .panel{position:absolute;left:0;right:0;bottom:0;width:auto;height:62dvh;border-left:0;border-top:1px solid var(--line);
      border-radius:16px 16px 0 0;transform:translateY(calc(100% - 116px));transition:transform .26s cubic-bezier(.3,.8,.4,1);
      box-shadow:0 -8px 26px rgba(90,66,38,.16)}
    .panel.open{transform:translateY(0)}
    .sheet-grip{display:block;width:40px;height:4px;border-radius:3px;background:var(--line2);margin:7px auto 1px;cursor:pointer}
    .legend{bottom:126px;font-size:10px}
    .ctl.zoom{bottom:210px}
    .filters{gap:6px;flex-wrap:nowrap;overflow-x:auto;pointer-events:auto;padding-bottom:2px;scrollbar-width:none}
    .filters::-webkit-scrollbar{display:none}
    .filters .chip{font-size:11px;padding:4px 9px 4px 6px}
    .brand .sub{display:none}
  }
  @media (max-width:520px){
    .brand h1{font-size:14px}
    .viewtabs button{padding:6px 10px;font-size:12px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>Ciudad de México</h1>
      <span class="sub">tap an area to learn it · pins = food, sights, shopping</span>
    </div>
    <div class="head-sp"></div>
    <div class="viewtabs" id="viewtabs">
      <button data-view="city" class="on">City</button>
      <button data-view="region">Day trips</button>
    </div>
    <button class="iconbtn" id="btnTips" title="Trip basics">?</button>
  </header>

  <div class="body">
    <div class="mapwrap" id="mapwrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="trees" width="9" height="9" patternUnits="userSpaceOnUse">
            <circle cx="3" cy="3" r="1.5" fill="rgba(46,110,62,.22)"/>
            <circle cx="7" cy="7" r="1.1" fill="rgba(46,110,62,.16)"/>
          </pattern>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#6b4a20" flood-opacity=".18"/>
          </filter>
        </defs>
        <g id="gWorld">
          <clipPath id="cityClip"><path id="cityClipPath" d=""/></clipPath>
          <g id="gCells"></g>
          <g id="gFeat" class="feat"></g>
          <g id="gRoads"></g>
          <g id="gBound"></g>
        </g>
        <g id="gPins"></g>
        <g id="gLabels"></g>
      </svg>

      <div class="filters" id="filters"></div>

      <div class="ctl zoom">
        <button id="zin" title="Zoom in">+</button>
        <button id="zout" title="Zoom out">&minus;</button>
        <button id="zreset" class="small" title="Zoom out to the whole city / back to the centre">All</button>
      </div>

      <div class="legend" id="legend">
        <h4>Area character <span id="legToggle">hide</span></h4>
        <div class="rows" id="legRows"></div>
        <div class="hint">Areas are drawn as simplified zones, not exact boundaries — good for orientation, not for navigation.</div>
      </div>

      <div class="tip" id="tip"></div>
    </div>

    <aside class="panel" id="panel">
      <div class="sheet-grip" id="grip"></div>
      <div class="search" id="searchWrap">
        <span class="mag">&#9906;</span>
        <input id="q" type="search" placeholder="Search areas, restaurants, sights…" autocomplete="off" spellcheck="false" />
        <button class="clr" id="qclr" title="Clear">&times;</button>
        <div class="results" id="results"></div>
      </div>
      <div class="ptabs" id="ptabs">
        <button data-tab="detail" class="on">Selected</button>
        <button data-tab="areas">All areas</button>
        <button data-tab="list">Highlights</button>
        <button data-tab="tips">Basics</button>
      </div>
      <div class="pbody" id="pbody"></div>
    </aside>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   1. AREA DATA  — simplified zones, positioned by real coordinates.
      pts: one or more seed points (lat, lon). Multi-point areas get an
      elongated / larger zone, which matches the real footprint better.
   ========================================================================= */
const CHAR = {
  historic:{label:"Historic core",   fill:"#e0a06a"},
  trendy:  {label:"Trendy / dining", fill:"#e08ba0"},
  upscale: {label:"Upscale",         fill:"#e0c274"},
  local:   {label:"Everyday local",  fill:"#a8bf9b"},
  culture: {label:"Colonial & arts", fill:"#8fb6cc"},
  green:   {label:"Parks & water",   fill:"#8fc79b"},
  outer:   {label:"Outer / transit", fill:"#c3bcaf"}
};

const AREAS = [
{id:"centro", name:"Centro Histórico", es:"Cuauhtémoc", char:"historic", pts:[[19.4345,-99.1345],[19.4300,-99.1265],[19.4400,-99.1330]],
 blurb:"The 700-year-old heart of the city, built on the ruins of Aztec Tenochtitlán and paved with volcanic stone. The Zócalo, the cathedral, the Templo Mayor dig and Diego Rivera's murals in the Palacio Nacional are all within four blocks of each other, surrounded by streets that each sell one thing — lamps on one, wedding dresses on the next.",
 best:"Big-ticket history, murals, cantinas, street food",
 metro:"Zócalo (L2), Allende (L2), Bellas Artes (L2/L8)",
 feel:"Loud, dense, endlessly interesting by day; quieter and patchier after dark",
 tip:"Go on a Sunday morning when museums are cheap and traffic disappears. Rooftop terraces on Madero and 5 de Mayo have the best cathedral views."},

{id:"alameda", name:"Alameda & Tabacalera", es:"Cuauhtémoc", char:"historic", pts:[[19.4370,-99.1460],[19.4405,-99.1545]],
 blurb:"The western edge of the old city, anchored by the Alameda Central — the oldest public park in the Americas — and the marble Palacio de Bellas Artes. Behind it, Tabacalera is a workaday quarter of art-deco blocks, the Monumento a la Revolución and a surprisingly good Cuban-and-cantina strip.",
 best:"Bellas Artes, murals, Sunday strolling",
 metro:"Bellas Artes (L2/L8), Hidalgo (L2/L3), Revolución (L2)",
 feel:"Grand civic buildings, wide sidewalks, a bit rough at the seams",
 tip:"The Museo Mural Diego Rivera holds his 'Dream of a Sunday Afternoon' — it's small, cheap, and the single best 20 minutes in the area."},

{id:"lagunilla", name:"Lagunilla & Tepito", es:"Cuauhtémoc", char:"local", pts:[[19.4450,-99.1300]],
 blurb:"Mexico City's great flea-market district: Lagunilla's Sunday antiques bazaar spills for blocks, and neighbouring Tepito is the legendary — and genuinely rough — market barrio where everything in the city eventually turns up for sale.",
 best:"Sunday antiques hunting at Lagunilla, mariachi at nearby Garibaldi",
 metro:"Garibaldi (L8/LB), Lagunilla (LB)",
 feel:"Raw, crowded, all business",
 tip:"Lagunilla on Sunday is fine with normal city sense — go in daylight, carry little. Tepito proper is best skipped unless you're with someone local."},

{id:"guerrero", name:"Guerrero", es:"Cuauhtémoc", char:"local", pts:[[19.4470,-99.1450]],
 blurb:"A working-class grid just north-west of the centre, best known to visitors for the Biblioteca Vasconcelos — a jaw-dropping 'megalibrary' of suspended glass stacks and a whale skeleton — and for cheap eats around Buenavista station.",
 best:"Vasconcelos library, train/bus connections",
 metro:"Guerrero (L3/LB), Buenavista (LB, Tren Suburbano)",
 feel:"Ordinary, busy, not a lingering neighbourhood",
 tip:"Buenavista is where the suburban train and the Mexibús to the north converge — handy if you're heading toward Tepotzotlán."},

{id:"tlatelolco", name:"Tlatelolco", es:"Cuauhtémoc", char:"local", pts:[[19.4545,-99.1390]],
 blurb:"A vast 1960s housing estate around the Plaza de las Tres Culturas, where an Aztec ceremonial site, a 16th-century church and modernist towers stand in one frame. It's also the site of the 1968 student massacre, remembered in a small, sobering memorial museum.",
 best:"Layered history, brutalist architecture, quiet plazas",
 metro:"Tlatelolco (L3), Garibaldi (L8/LB)",
 feel:"Open, breezy, residential, low-key",
 tip:"Combine it with the Basílica: they're a short taxi ride apart on the same northern axis."},

{id:"sanrafael", name:"San Rafael", es:"Cuauhtémoc", char:"local", pts:[[19.4400,-99.1595]],
 blurb:"A faded belle-époque neighbourhood of theatres, mansions carved into apartments and old cantinas — the city's theatre district, now quietly filling with cheap studios and coffee bars. Ribera de San Cosme is a proper street-food corridor.",
 best:"Theatre, cheap eats, old-city architecture without crowds",
 metro:"San Cosme (L2), Normal (L2)",
 feel:"Lived-in, gently bohemian, a decade behind Roma",
 tip:"El Califa de León — the tiny taquería that held a Michelin star in 2024 and 2025 — is a counter with four stools on Ribera de San Cosme."},

{id:"smr", name:"Santa María la Ribera", es:"Cuauhtémoc", char:"local", pts:[[19.4505,-99.1625]],
 blurb:"Built around the Kiosco Morisco, a fantastical Moorish pavilion shipped back from a world's fair, this is one of the city's most photogenic old barrios — porfirian houses, a geology museum full of meteorites, and a rising café scene.",
 best:"Architecture wandering, weekend markets, low prices",
 metro:"San Cosme (L2), Buenavista (LB)",
 feel:"Neighbourly and green in the middle, scruffier at the edges",
 tip:"The Museo de Geología (UNAM) has a spiral iron staircase worth the entry alone."},

{id:"juarez", name:"Juárez & Zona Rosa", es:"Cuauhtémoc", char:"trendy", pts:[[19.4265,-99.1600],[19.4290,-99.1520]],
 blurb:"Between Reforma and Roma: Juárez is the city's sharpest small-restaurant-and-cocktail zone right now, while the adjoining Zona Rosa is the historic LGBTQ+ nightlife quarter, now also home to a busy Koreatown of barbecue joints and karaoke.",
 best:"Cocktail bars, Korean food, nightlife, walkability to everything",
 metro:"Insurgentes (L1), Cuauhtémoc (L1), Sevilla (L1)",
 feel:"Late-night, mixed, energetic; scruffy in patches",
 tip:"Handshake Speakeasy and Hanky Panky are both here and both need reservations — book days ahead, not hours."},

{id:"cuauhtemoc", name:"Colonia Cuauhtémoc", es:"Cuauhtémoc", char:"trendy", pts:[[19.4335,-99.1690]],
 blurb:"The embassy strip north of Reforma — streets named after rivers, quiet mid-century blocks, and a dense little cluster of very good restaurants and wine bars that locals treat as an extension of Juárez.",
 best:"Grown-up dining, hotels near Reforma, easy Chapultepec access",
 metro:"Sevilla (L1), Chapultepec (L1)",
 feel:"Calm, leafy, professional",
 tip:"Río Pánuco and Río Lerma are the two streets to walk if you want dinner options without a plan."},

{id:"romanorte", name:"Roma Norte", es:"Cuauhtémoc", char:"trendy", pts:[[19.4180,-99.1640],[19.4145,-99.1580]],
 blurb:"The neighbourhood most visitors fall for: early-1900s European-style mansions, jacaranda-lined streets, two Michelin-starred kitchens within four blocks, and a bookshop-gallery-coffee density that makes a whole day evaporate.",
 best:"Restaurants, design shops, galleries, staying put",
 metro:"Insurgentes (L1), Hospital General (L3), Metrobús along Álvaro Obregón",
 feel:"Handsome, walkable, busy, increasingly expensive",
 tip:"Álvaro Obregón is the spine; Colima and Córdoba are the prettiest strolls. Book Rosetta and Máximo well ahead."},

{id:"romasur", name:"Roma Sur", es:"Cuauhtémoc", char:"trendy", pts:[[19.4055,-99.1615]],
 blurb:"Roma Norte's cheaper, quieter half below Coahuila — the same architecture with fewer tourists, plus the Mercado Medellín, an excellent Latin-American market where the city's Colombian, Cuban and Venezuelan communities shop.",
 best:"Market eating, calmer stays, value",
 metro:"Centro Médico (L3/L9), Hospital General (L3)",
 feel:"Residential and easygoing",
 tip:"Go to Mercado Medellín hungry: ceviche counters, tropical fruit, and a whole aisle of Caribbean spice."},

{id:"condesa", name:"Condesa", es:"Cuauhtémoc", char:"trendy", pts:[[19.4115,-99.1740],[19.4155,-99.1780]],
 blurb:"Art-deco apartment blocks curled around two parks — Parque México, built on an old racetrack, and Parque España. Pavement cafés, dog walkers, and a bar-to-block ratio that makes it the easiest place in the city to spend an evening on foot.",
 best:"Café mornings, park walks, casual dinners, nightlife that isn't loud",
 metro:"Chilpancingo (L9), Patriotismo (L9), Sevilla (L1)",
 feel:"Green, mellow, expat-heavy, very walkable",
 tip:"Amsterdam is the oval street that traces the old racetrack — walking its full loop takes about 25 minutes."},

{id:"escandon", name:"Escandón", es:"Miguel Hidalgo", char:"trendy", pts:[[19.4020,-99.1830]],
 blurb:"Condesa's low-key neighbour across the Viaducto: a grid of two-storey houses, taquerías, and mechanics that has quietly become where priced-out chefs and designers moved. Great value, very few tourists.",
 best:"Neighbourhood taquerías, cheaper rentals, day-to-day life",
 metro:"Patriotismo (L9), Juanacatlán (L1)",
 feel:"Unpolished, friendly, genuinely local",
 tip:"The Sunday tianguis (street market) here is the real thing — produce, fried fish, and pirated everything."},

{id:"doctores", name:"Doctores", es:"Cuauhtémoc", char:"local", pts:[[19.4180,-99.1450]],
 blurb:"A gritty grid of hospitals, garages and wholesale parts shops squeezed between Roma and the centre — and the home of Arena México, the cathedral of lucha libre. Its reputation is worse than a daytime visit warrants, but it's not a stroll-at-night barrio.",
 best:"Lucha libre nights, cheap comida corrida",
 metro:"Doctores (L8), Cuauhtémoc (L1), Niños Héroes (L3)",
 feel:"Industrial, unglamorous, straightforward",
 tip:"Arena México fights are Tuesday, Friday and Sunday. Take a taxi or ride-share to the door and back."},

{id:"polanco", name:"Polanco", es:"Miguel Hidalgo", char:"upscale", pts:[[19.4325,-99.1930],[19.4380,-99.2020],[19.4390,-99.1880]],
 blurb:"The luxury quarter: Avenida Presidente Masaryk is the flagship-boutique street, Lincoln and Dumas hold both of the city's two-star restaurants, and the Soumaya and Jumex museums sit together in the Plaza Carso development on the north edge.",
 best:"Fine dining, luxury shopping, big-name museums, business hotels",
 metro:"Polanco (L7), Auditorio (L7)",
 feel:"Polished, expensive, orderly, a little corporate",
 tip:"Pujol and Quintonil are both here and both open reservations weeks out — set a calendar reminder for the release date."},

{id:"anzures", name:"Anzures", es:"Miguel Hidalgo", char:"upscale", pts:[[19.4300,-99.1790]],
 blurb:"A small wedge between Reforma, Polanco and Chapultepec, full of mid-century apartment buildings, Lebanese-Mexican bakeries and business hotels — quiet, central, and cheaper than Polanco for the same walking distances.",
 best:"Value hotels near Reforma, quick Chapultepec access",
 metro:"Chapultepec (L1), Auditorio (L7)",
 feel:"Understated and residential",
 tip:"You can walk from here to the Anthropology Museum in about 15 minutes through the park."},

{id:"chapultepec", name:"Bosque de Chapultepec", es:"Miguel Hidalgo", char:"green", pts:[[19.4210,-99.1840],[19.4145,-99.2040],[19.4080,-99.2260]],
 blurb:"One of the largest city parks in the Western Hemisphere — nearly twice Central Park — in three sections. The first holds the castle on its hill, the Anthropology Museum, a lake and the zoo; the second has the children's museum and fountains; the third is rough woodland.",
 best:"The Anthropology Museum, the castle, boating, a free half-day",
 metro:"Chapultepec (L1), Auditorio (L7), Constituyentes (L7)",
 feel:"Woodland, families, vendors, joggers; packed on Sundays",
 tip:"Museums here close Mondays. Arrive at Antropología at opening — it takes three hours minimum and gets crushed by 1pm."},

{id:"sanmiguel", name:"San Miguel Chapultepec", es:"Miguel Hidalgo", char:"culture", pts:[[19.4085,-99.1885]],
 blurb:"A hushed pocket of galleries and low houses on the park's southern flank, and the location of Casa Luis Barragán — the UNESCO-listed home of Mexico's greatest modern architect, and the city's best small-scale architectural experience.",
 best:"Architecture, contemporary galleries, quiet lunches",
 metro:"Constituyentes (L7), Juanacatlán (L1)",
 feel:"Residential, arty, calm",
 tip:"Casa Barragán is guided-tour-only and books out weeks ahead; reserve online before you fly."},

{id:"lomas", name:"Lomas de Chapultepec", es:"Miguel Hidalgo", char:"upscale", pts:[[19.4270,-99.2160],[19.4190,-99.2340]],
 blurb:"Wooded ravines full of walled mansions, embassies and private clubs, laid out along a curving continuation of Reforma. Not a walking neighbourhood, but home to some destination restaurants and the calmest luxury hotels.",
 best:"Special-occasion dinners, quiet high-end stays",
 metro:"None nearby — ride-share territory",
 feel:"Green, gated, very quiet",
 tip:"La Once Mil, one of the newest Michelin stars in the city, is up here on Monte Everest."},

{id:"tacubaya", name:"Tacubaya", es:"Miguel Hidalgo", char:"local", pts:[[19.4020,-99.1875]],
 blurb:"An ancient village swallowed by the city and now a huge transit knot where three metro lines meet, wrapped in market stalls and torta stands. Chaotic, useful, and hiding a couple of genuine landmarks including Barragán's own house on its edge.",
 best:"Transit connections, market snacking",
 metro:"Tacubaya (L1/L7/L9) — a major interchange",
 feel:"Crowded and utilitarian",
 tip:"If you're crossing the city, this is the transfer that saves you the most time — and the one to keep your bag in front of you at."},

{id:"napoles", name:"Nápoles & WTC", es:"Benito Juárez", char:"local", pts:[[19.3945,-99.1780]],
 blurb:"A mid-century business district around the World Trade Center tower and the Polyforum Siqueiros, whose exterior carries one of the largest murals on earth. Convention hotels, steady restaurants, and the wide Insurgentes corridor.",
 best:"Conferences, the Polyforum mural, easy Metrobús access",
 metro:"San Antonio (L7), Poliforum/Nápoles (Metrobús L1)",
 feel:"Corporate by day, quiet at night",
 tip:"Insurgentes is the world's longest avenue in a single city — the Metrobús runs its length and is the fastest surface transport you'll find."},

{id:"delvalle", name:"Del Valle", es:"Benito Juárez", char:"local", pts:[[19.3860,-99.1690],[19.3740,-99.1650]],
 blurb:"A large, prosperous middle-class grid of tree-lined streets, bakeries and neighbourhood restaurants where a lot of the city actually lives. Safe, unhurried, and increasingly where visitors book apartments when Roma prices bite.",
 best:"Long stays, family travel, everyday restaurants",
 metro:"Zapata (L3/L12), División del Norte (L12), Insurgentes Sur (Metrobús)",
 feel:"Calm, green, quietly comfortable",
 tip:"The Mítikah mall and the tiny colonial village of Xoco sit on its southern edge, an odd and interesting pairing."},

{id:"narvarte", name:"Narvarte", es:"Benito Juárez", char:"trendy", pts:[[19.3960,-99.1540]],
 blurb:"The city's most serious eating neighbourhood if you skip the tablecloths: taquerías, cantinas, seafood counters and a dense concentration of the sort of places locals argue about. El Vilsito — a mechanic's shop by day, a legendary al pastor stand by night — is the emblem.",
 best:"Tacos, cantinas, seafood, no-frills value",
 metro:"Etiopía (L3), Eugenia (L3), Parque Delta (Metrobús)",
 feel:"Unpretentious, residential, food-obsessed",
 tip:"Come hungry after 9pm — this is a night-eating neighbourhood, not a lunch one."},

{id:"mixcoac", name:"Mixcoac & San Pedro", es:"Benito Juárez", char:"local", pts:[[19.3765,-99.1880]],
 blurb:"Another absorbed colonial village, with a small pyramid site, a stone plaza, a university campus and a big shopping node where Insurgentes and Río Mixcoac cross.",
 best:"Quiet plazas, shopping, transit south",
 metro:"Mixcoac (L7/L12), Barranca del Muerto (L7)",
 feel:"Mixed old-village and modern-corridor",
 tip:"The Plaza Jacarandas area is lovely in March–April when the jacarandas turn the whole city purple."},

{id:"sanangel", name:"San Ángel", es:"Álvaro Obregón", char:"culture", pts:[[19.3465,-99.1905]],
 blurb:"Cobbled streets, bougainvillea over stone walls and colonial mansions on the volcanic slope — the prettiest colonial quarter in the south. The Saturday Bazar Sábado fills the Plaza San Jacinto with crafts and painters, and the Rivera–Kahlo studio houses are five minutes away.",
 best:"Saturday crafts, colonial wandering, long lunches",
 metro:"Miguel Ángel de Quevedo (L3), then a walk; Metrobús on Insurgentes",
 feel:"Genteel, touristy in the best way, hilly",
 tip:"Do San Ángel on Saturday and Coyoacán on Sunday — that's the classic southern weekend, and they're 20 minutes apart."},

{id:"pedregal", name:"Pedregal", es:"Álvaro Obregón", char:"upscale", pts:[[19.3200,-99.2060],[19.3060,-99.2160]],
 blurb:"Modernist houses built into a black lava field left by the Xitle volcano — an architecturally famous, very wealthy enclave of walls and gardens on the city's southern rim, next to the Perisur mall.",
 best:"Architecture pilgrimage, destination dining",
 metro:"None — ride-share",
 feel:"Silent, green, gated",
 tip:"Sud 777, a long-standing Michelin star, is out here and works well as a lunch on the way back from Xochimilco."},

{id:"santafe", name:"Santa Fe", es:"Cuajimalpa / Álvaro Obregón", char:"upscale", pts:[[19.3660,-99.2690],[19.3560,-99.2510],[19.3760,-99.2600]],
 blurb:"A high-rise corporate city built on a former rubbish dump and quarry on the western ridge — glass towers, one of Latin America's largest malls, and almost nothing at street level. Included here mostly so you know to avoid staying here as a tourist.",
 best:"Business, the mall, mountain views",
 metro:"None — Ferrocarriles suburban buses and ride-share only",
 feel:"Car-dependent, corporate, disconnected",
 tip:"Traffic in and out is genuinely brutal at rush hour; budget 60–90 minutes to the centre."},

{id:"coyoacan", name:"Coyoacán", es:"Coyoacán", char:"culture", pts:[[19.3500,-99.1620],[19.3410,-99.1690],[19.3560,-99.1520]],
 blurb:"The colonial village where Cortés set up and Frida Kahlo grew up — twin plazas, a coyote fountain, a covered market famous for tostadas, and the cobalt-blue Casa Azul where Kahlo lived and died. Sundays bring balloon sellers, buskers and half the city.",
 best:"Casa Azul, the market, plazas, weekend atmosphere",
 metro:"Coyoacán (L3) and Viveros (L3) — both a 15–20 min walk from the plazas",
 feel:"Villagey, festive, green, crowded at weekends",
 tip:"Buy Casa Azul tickets online days ahead — walk-ups routinely sell out. Trotsky's house is a five-minute walk away and rarely busy."},

{id:"cu", name:"Ciudad Universitaria", es:"Coyoacán", char:"culture", pts:[[19.3320,-99.1855]],
 blurb:"UNAM's main campus, a UNESCO World Heritage site: 1950s modernism scattered across lava fields, with the mosaic-clad Central Library, the Olympic stadium mural, a sculpture park in the lava and the excellent MUAC contemporary art museum.",
 best:"Architecture, murals, contemporary art, student prices",
 metro:"Universidad (L3), then the free campus shuttle (Pumabús)",
 feel:"Vast, open, young, easy",
 tip:"The Espacio Escultórico — huge concrete blocks ringing raw lava — is the most underrated sight in the city."},

{id:"xochimilco", name:"Xochimilco", es:"Xochimilco", char:"green", pts:[[19.2700,-99.1050],[19.2570,-99.0870],[19.2810,-99.1230]],
 blurb:"The last surviving stretch of the lake and canal system the Aztecs farmed, now a UNESCO site where painted trajinera barges drift past floating gardens with mariachis, micheladas and food boats pulling alongside. Also a working farming zone.",
 best:"A boat afternoon, chinampa farm tours, birdlife",
 metro:"Tren Ligero from Tasqueña (L2) to Xochimilco",
 feel:"Festive and loud at the main docks; silent and rural a few canals over",
 tip:"Embarcadero Nativitas is the party dock; Cuemanco is the quiet, ecological one. Boats are priced per hour per boat — agree the rate before you step on."},

{id:"tlalpan", name:"Tlalpan", es:"Tlalpan", char:"outer", pts:[[19.2920,-99.1670],[19.2990,-99.1920],[19.2800,-99.1600]],
 blurb:"Another colonial village centre — a leafy plaza, a 16th-century church, good cantinas — with the pine-forested Bosque de Tlalpan alongside and the Estadio Azteca just to the east.",
 best:"Forest walks, quiet colonial plaza, football",
 metro:"Tren Ligero to Estadio Azteca; buses along Calzada de Tlalpan",
 feel:"Suburban, calm, cooler and greener than the centre",
 tip:"The Bosque de Tlalpan is the city's best proper walk in the woods — 2,000-plus metres up, so take it slowly."},

{id:"lavilla", name:"La Villa & GAM", es:"Gustavo A. Madero", char:"historic", pts:[[19.4850,-99.1180],[19.5060,-99.1400],[19.4700,-99.1050]],
 blurb:"The northern pilgrimage district built around the Basílica de Guadalupe, where the country's patron image hangs above a moving walkway that carries millions of visitors past it each year. The old sinking basilica leans beside the new one.",
 best:"The Basílica complex, the hill chapel and its view",
 metro:"La Villa-Basílica (L6), Deportivo 18 de Marzo (L3/L6)",
 feel:"Devotional, busy, non-touristy in the ordinary sense",
 tip:"Climb the steps to the Capilla del Cerrito for the best free panorama of the northern city."},

{id:"airport", name:"Airport & Venustiano Carranza", es:"Venustiano Carranza", char:"outer", pts:[[19.4340,-99.0790],[19.4270,-99.1090],[19.4420,-99.0950]],
 blurb:"The zone east of the centre running out to Benito Juárez International (MEX), plus the enormous La Merced market complex on its inner edge — the wholesale belly of the city, where restaurant kitchens buy at dawn.",
 best:"Flights, La Merced market, cheap airport hotels",
 metro:"Terminal Aérea (L5), Pantitlán (L1/L5/L9/LA), Merced (L1)",
 feel:"Functional; the market end is intense and worth it",
 tip:"Terminal 1 and Terminal 2 are far apart — allow 20–30 minutes and use the Aerotrén (airside) or a taxi between them."},

{id:"iztacalco", name:"Iztacalco & Ciudad Deportiva", es:"Iztacalco", char:"outer", pts:[[19.3980,-99.0950],[19.4050,-99.1150]],
 blurb:"Mostly residential, but it's where you'll come for a concert or a ball game: the Foro Sol/Estadio GNP, the Palacio de los Deportes dome and the Autódromo Hermanos Rodríguez Formula 1 circuit share one huge sports campus.",
 best:"Concerts, F1, baseball, big events",
 metro:"Ciudad Deportiva (L9), Velódromo (L9)",
 feel:"Quiet streets around a giant event island",
 tip:"On event nights the metro is far faster than any car — the road exits jam solid for hours."},

{id:"iztapalapa", name:"Iztapalapa", es:"Iztapalapa", char:"outer", pts:[[19.3600,-99.0680],[19.3400,-99.0820],[19.3750,-99.0450]],
 blurb:"The city's most populous borough — a working-class expanse under the Cerro de la Estrella, where the New Fire ceremony once opened each Aztec 52-year cycle and where an enormous Passion Play now draws millions each Good Friday.",
 best:"Holy Week processions, Cerro de la Estrella views, cablebús ride",
 metro:"Constitución de 1917 (L8), Cablebús Línea 2",
 feel:"Dense, hilly, everyday; not set up for tourism",
 tip:"The Cablebús cable car over the hills is a cheap, spectacular ride and the easiest way to see this side of the city."},

{id:"azcapotzalco", name:"Azcapotzalco", es:"Azcapotzalco", char:"local", pts:[[19.4830,-99.1850],[19.4700,-99.1620]],
 blurb:"An old pre-Hispanic capital turned industrial north-west borough, with a pleasant colonial centre, a big convent church, and one of the city's best-loved traditional markets.",
 best:"Local markets, colonial plaza, no tourists at all",
 metro:"Azcapotzalco (L6), Ferrería (L6)",
 feel:"Industrial edges around a village core",
 tip:"Worth a detour only if you like ordinary neighbourhoods — but that's exactly what makes it pleasant."},

{id:"satelite", name:"Naucalpan & Satélite", es:"Estado de México", char:"outer", pts:[[19.5090,-99.2330],[19.4760,-99.2210],[19.4900,-99.2500]],
 blurb:"Across the state line in the Estado de México: 1950s middle-class suburbia announced by the Torres de Satélite, five giant coloured concrete prisms by Barragán and Goeritz that split the motorway. Plaza Satélite was one of Latin America's first big malls.",
 best:"Mid-century design, mall shopping, the towers",
 metro:"None — Mexibús and ride-share",
 feel:"Suburban, car-first",
 tip:"You pass the towers on the way to Tepotzotlán or the Teotihuacán pyramids — worth the two-minute photo stop."}
];

/* =========================================================================
   5. GEOMETRY — projection + clipped zone diagram
   ========================================================================= */
const LAT0=19.39, LON0=-99.16, SC=1000, KX=Math.cos(LAT0*Math.PI/180);
const px=(lat,lon)=>({x:(lon-LON0)*KX*SC, y:-(lat-LAT0)*SC});

function polyArea(p){let a=0;for(let i=0,n=p.length;i<n;i++){const q=p[(i+1)%n];a+=p[i].x*q.y-q.x*p[i].y}return a/2}
function polyCentroid(p){
  let a=0,cx=0,cy=0;
  for(let i=0,n=p.length;i<n;i++){const q=p[(i+1)%n],f=p[i].x*q.y-q.x*p[i].y;a+=f;cx+=(p[i].x+q.x)*f;cy+=(p[i].y+q.y)*f}
  a/=2; if(Math.abs(a)<1e-9)return{x:p[0].x,y:p[0].y,a:0};
  return {x:cx/(6*a), y:cy/(6*a), a:Math.abs(a)};
}
/* Sutherland–Hodgman clip against half-plane n·x <= c. Edge tags: b=city edge, c=cut */
function clipHalf(poly,nx,ny,c){
  const out=[],n=poly.length;
  for(let i=0;i<n;i++){
    const A=poly[i],B=poly[(i+1)%n];
    const da=nx*A.x+ny*A.y-c, db=nx*B.x+ny*B.y-c;
    if(da<=0) out.push({x:A.x,y:A.y,e:A.e});
    if((da<0&&db>0)||(da>0&&db<0)){
      const t=da/(da-db);
      out.push({x:A.x+t*(B.x-A.x), y:A.y+t*(B.y-A.y), e: da<0?'c':A.e});
    }
  }
  return out;
}

/* Build the zone diagram: every seed point gets a cell; cells of the same area
   are drawn as one zone (interior seams are not stroked). */
const BOUND = CITY_BOUND.map(([la,lo])=>{const p=px(la,lo);return{x:p.x,y:p.y,e:'b'}});
const SITES=[]; AREAS.forEach((a,ai)=>a.pts.forEach(([la,lo])=>{const p=px(la,lo);SITES.push({x:p.x,y:p.y,ai,id:a.id})}));

function buildZones(){
  const cells=SITES.map(()=>null);
  for(let i=0;i<SITES.length;i++){
    let poly=BOUND.slice();
    const pi=SITES[i];
    for(let j=0;j<SITES.length && poly.length>2;j++){
      if(i===j)continue;
      const pj=SITES[j], nx=pj.x-pi.x, ny=pj.y-pi.y;
      const c=(nx*(pi.x+pj.x)+ny*(pi.y+pj.y))/2;
      poly=clipHalf(poly,nx,ny,c);
    }
    cells[i]=poly;
  }
  AREAS.forEach(a=>{a._cells=[];a._area=0;a._cx=0;a._cy=0});
  cells.forEach((poly,i)=>{
    if(!poly||poly.length<3)return;
    const a=AREAS[SITES[i].ai], ct=polyCentroid(poly);
    a._cells.push(poly); a._area+=ct.a; a._cx+=ct.x*ct.a; a._cy+=ct.y*ct.a;
  });
  AREAS.forEach(a=>{ if(a._area>0){a._cx/=a._area;a._cy/=a._area} else {const p=px(a.pts[0][0],a.pts[0][1]);a._cx=p.x;a._cy=p.y} });

  /* classify every edge: city outline / zone border / interior seam */
  const nearestAi=(x,y)=>{ let b1=1e18,b2=1e18,a1=-1,a2=-1;
    for(const s of SITES){const d=(s.x-x)**2+(s.y-y)**2;
      if(d<b1){b2=b1;a2=a1;b1=d;a1=s.ai}else if(d<b2){b2=d;a2=s.ai}}
    return [a1,a2]; };
  AREAS.forEach(a=>{ a._outline=[]; });
  const cityEdges=[];
  cells.forEach((poly,i)=>{
    if(!poly||poly.length<3)return;
    const ai=SITES[i].ai;
    for(let v=0;v<poly.length;v++){
      const A=poly[v],B=poly[(v+1)%poly.length];
      if(A.e==='b'){ cityEdges.push([A.x,A.y,B.x,B.y]); AREAS[ai]._outline.push([A.x,A.y,B.x,B.y]); continue; }
      const mx=(A.x+B.x)/2,my=(A.y+B.y)/2, nn=nearestAi(mx,my);
      if(nn[0]!==nn[1]) AREAS[ai]._outline.push([A.x,A.y,B.x,B.y]);
    }
  });
  /* de-duplicate zone borders for drawing (each shared edge appears twice) */
  const seen=new Set(), borders=[];
  AREAS.forEach(a=>a._outline.forEach(e=>{
    const k=[Math.round(e[0]*4),Math.round(e[1]*4),Math.round(e[2]*4),Math.round(e[3]*4)].sort().join(",");
    if(seen.has(k))return; seen.add(k); borders.push(e);
  }));
  return {borders, cityEdges};
}
const ZONES = buildZones();

/* ---- pin shapes ---- */
function pinPath(shape,r){
  switch(shape){
    case "star":{let d="";for(let i=0;i<10;i++){const rr=i%2?r*0.46:r*1.02,a=-Math.PI/2+i*Math.PI/5;
      d+=(i?"L":"M")+(Math.cos(a)*rr).toFixed(2)+" "+(Math.sin(a)*rr).toFixed(2)}return d+"Z"}
    case "triangle":return `M0 ${(-r*1.08).toFixed(2)}L${(r).toFixed(2)} ${(r*0.78).toFixed(2)}L${(-r).toFixed(2)} ${(r*0.78).toFixed(2)}Z`;
    case "square":return `M${-r*.84} ${-r*.84}H${r*.84}V${r*.84}H${-r*.84}Z`;
    case "diamond":return `M0 ${-r*1.1}L${r*1.02} 0L0 ${r*1.1}L${-r*1.02} 0Z`;
    case "pent":{let d="";for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;
      d+=(i?"L":"M")+(Math.cos(a)*r).toFixed(2)+" "+(Math.sin(a)*r).toFixed(2)}return d+"Z"}
    case "hex":{let d="";for(let i=0;i<6;i++){const a=i*Math.PI/3;
      d+=(i?"L":"M")+(Math.cos(a)*r).toFixed(2)+" "+(Math.sin(a)*r).toFixed(2)}return d+"Z"}
    default:return `M${-r} 0a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0Z`;
  }
}

/* =========================================================================
   7. VIEWPORT + OVERLAY (labels & pins live in screen space)
   ========================================================================= */
let W=0,H=0;
function resize(){
  const r=$("#mapwrap").getBoundingClientRect();
  W=Math.max(320,r.width); H=Math.max(320,r.height);
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
}
function visibleH(){
  if(window.innerWidth<=860) return state.panelOpen ? Math.max(210,H*0.36) : H-116;
  return H;
}
function worldBBox(){
  let pts;
  if(state.view==="city") pts=BOUND.map(p=>({x:p.x,y:p.y}));
  else{ pts=CITY_BOUND.map(([la,lo])=>px(la,lo)).concat(TRIPS.map(t=>px(t.lat,t.lon))); }
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  return {x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)};
}
function fitView(anim){
  const b=worldBBox(), pad=state.view==="city"?0.90:0.84;
  const bw=b.x1-b.x0, bh=b.y1-b.y0;
  const availH = visibleH();
  const k=Math.min(W/bw, availH/bh)*pad;
  state.fit=k; state.k=k;
  state.tx=W/2-(b.x0+b.x1)/2*k;
  state.ty=availH/2-(b.y0+b.y1)/2*k;
  applyTransform();
}
function fitBox(la0,la1,lo0,lo1,pad){
  const a=px(la1,lo0), b=px(la0,lo1);
  const bw=Math.abs(b.x-a.x), bh=Math.abs(b.y-a.y);
  const availH=visibleH();
  state.k=Math.min(W/bw, availH/bh)*(pad||0.94);
  state.tx=W/2-(a.x+b.x)/2*state.k; state.ty=availH/2-(a.y+b.y)/2*state.k;
  applyTransform();
}
const CORE=[19.325,19.500,-99.245,-99.085];
function fitCore(){ fitBox(CORE[0],CORE[1],CORE[2],CORE[3]); }
function applyTransform(){
  gWorld.setAttribute("transform",`translate(${state.tx.toFixed(2)} ${state.ty.toFixed(2)}) scale(${state.k.toFixed(4)})`);
  gWorld.querySelectorAll("path,ellipse").forEach(n=>n.setAttribute("vector-effect","non-scaling-stroke"));
  paintOverlay();
}
const S2=(x,y)=>[x*state.k+state.tx, y*state.k+state.ty];
function zoomAt(cx,cy,f){
  const nk=Math.max(state.fit*0.55,Math.min(state.fit*26,state.k*f));
  const wx=(cx-state.tx)/state.k, wy=(cy-state.ty)/state.k;
  state.k=nk; state.tx=cx-wx*nk; state.ty=cy-wy*nk; applyTransform();
}
function flyTo(wx,wy,k){
  const target=k||Math.max(state.k,state.fit*4.2);
  const availH=visibleH();
  state.k=Math.min(state.fit*26,target);
  state.tx=W/2-wx*state.k; state.ty=availH/2-wy*state.k; applyTransform();
}

function hitRect(r,list){
  for(const q of list) if(!(r[2]<q[0]||r[0]>q[2]||r[3]<q[1]||r[1]>q[3])) return true;
  return false;
}
const CATORDER=["star","sight","museum","shop","bar","eat","park"];

function paintOverlay(){
  gLabels.innerHTML=""; gPins.innerHTML="";
  const taken=[];
  if(state.view==="city"){
    /* --- area labels --- */
    const list=AREAS.slice().sort((a,b)=>(b.id===state.sel?1e9:b._area)-(a.id===state.sel?1e9:a._area));
    list.forEach(a=>{
      const [sx,sy]=S2(a._cx,a._cy);
      if(sx<-40||sx>W+40||sy<-20||sy>H+20)return;
      const isSel=state.sel===a.id;
      const zoomed=state.k/state.fit;
      const small=a._area<1400 && zoomed<1.35;
      const name=a.name;
      const fs=isSel?12.8:(a._area>5200?12:10.6);
      const wpx=name.length*fs*0.52, hpx=fs+4;
      const r=[sx-wpx/2-2,sy-hpx/2-1,sx+wpx/2+2,sy+hpx/2+1];
      if(!isSel && (small || hitRect(r,taken))) return;
      taken.push(r);
      const t=el("text",{x:sx.toFixed(1),y:(sy+fs*0.34).toFixed(1),
        class:"lbl"+(a._area>5200?" big":"")+(a.char==="green"?" park":"")+(isSel?" sel":"")});
      t.setAttribute("font-size",fs.toFixed(1)); t.textContent=name;
      gLabels.appendChild(t);
    });
    /* --- pins --- */
    const pins=POIS.filter(p=>state.cats.has(p.c));
    const aaKey=activeArea();
    const rank=p=>(state.sel===p._key?4:0)+(aaKey&&p.a===aaKey?2:0)+(p.c==="star"?1:0);
    pins.sort((a,b)=>{
      const d=rank(b)-rank(a); if(d)return d;
      return CATORDER.indexOf(a.c)-CATORDER.indexOf(b.c);
    });
    const pinTaken=[], showNames=state.k/state.fit>2.6;
    pins.forEach(p=>{
      const w=px(p.lat,p.lon), [sx,sy]=S2(w.x,w.y);
      if(sx<-20||sx>W+20||sy<-20||sy>H+20)return;
      const isSel=state.sel===p._key, inArea=aaKey&&p.a===aaKey;
      const rr=isSel?8:6;
      const box=[sx-rr-2,sy-rr-2,sx+rr+2,sy+rr+2];
      if(!isSel && !inArea && hitRect(box,pinTaken))return;
      pinTaken.push(box);
      const g=el("g",{class:"pin"+(isSel?" sel":""), transform:`translate(${sx.toFixed(1)} ${sy.toFixed(1)})`});
      const cat=CATS[p.c];
      g.appendChild(el("path",{d:pinPath(cat.shape,rr), fill:cat.color, stroke:"#fff","stroke-width":isSel?2.2:1.5, filter:"url(#soft)"}));
      if(p.c==="star"&&p.s===2) g.appendChild(el("circle",{cx:0,cy:0,r:2.1,fill:"#fff",opacity:".92"}));
      g.style.cursor="pointer";
      g.addEventListener("click",e=>{e.stopPropagation();selectPoi(p._key)});
      g.addEventListener("pointerenter",e=>showTip(e,`<b>${p.n}</b>${p.c==="star"?' <i>'+(p.s===2?"★★":p.s===1?"★":"was ★")+'</i>':""}`));
      g.addEventListener("pointermove",moveTip);
      g.addEventListener("pointerleave",hideTip);
      gPins.appendChild(g);
      if(showNames||isSel||(inArea&&state.k/state.fit>1.8)){
        const fs=isSel?11.5:10.2, wpx=p.n.length*fs*0.52;
        const lr=[sx-wpx/2-2, sy+rr+3.5, sx+wpx/2+2, sy+rr+fs+5];
        if(!hitRect(lr,taken)&&!hitRect(lr,pinTaken)){
          taken.push(lr); pinTaken.push(lr);
          const t=el("text",{x:sx.toFixed(1), y:(sy+rr+fs+2).toFixed(1), class:"lbl sm"});
          t.setAttribute("font-size",fs.toFixed(1));
          if(isSel)t.setAttribute("font-weight","800");
          t.textContent=p.n; gLabels.appendChild(t);
        }
      }
    });
    /* selection outline */
    const so=$("#selOutline");
    if(so){
      const a=AREAS.find(a=>a.id===activeArea());
      so.setAttribute("d", a? a._outline.map(e=>`M${e[0].toFixed(1)} ${e[1].toFixed(1)}L${e[2].toFixed(1)} ${e[3].toFixed(1)}`).join("") : "");
    }
    gCells.querySelectorAll(".cell").forEach(c=>{
      const aa=activeArea(); c.classList.toggle("dim", !!aa && c.dataset.area!==aa);
    });
  } else {
    /* ---- region view ---- */
    const cl=el("text",{x:0,y:0,class:"lbl big"});
    const [ccx,ccy]=S2(REGION.cx,REGION.cy);
    cl.setAttribute("x",ccx.toFixed(1)); cl.setAttribute("y",ccy.toFixed(1)); cl.textContent="CIUDAD DE MÉXICO";
    gLabels.appendChild(cl);
    TRIPS.forEach(t=>{
      const w=px(t.lat,t.lon), [sx,sy]=S2(w.x,w.y);
      const isSel=state.sel==="@"+t.n, rr=isSel?9:7;
      const g=el("g",{class:"pin"+(isSel?" sel":""), transform:`translate(${sx.toFixed(1)} ${sy.toFixed(1)})`});
      g.appendChild(el("path",{d:pinPath(CATS[t.c].shape,rr), fill:CATS[t.c].color, stroke:"#fff","stroke-width":1.8, filter:"url(#soft)"}));
      g.style.cursor="pointer";
      g.addEventListener("click",e=>{e.stopPropagation();selectTrip(t.n)});
      g.addEventListener("pointerenter",e=>showTip(e,`<b>${t.n}</b> <i>${t.t}</i>`));
      g.addEventListener("pointermove",moveTip);
      g.addEventListener("pointerleave",hideTip);
      gPins.appendChild(g);
      const wpx=Math.max(t.n.length,t.t.length)*6.2;
      const cands=[sy+rr+3, sy-rr-27, sy+rr+29, sy-rr-53];
      let top=cands[0];
      for(const cd of cands){ const bx=[sx-wpx/2,cd,sx+wpx/2,cd+24]; if(!hitRect(bx,taken)){top=cd;break} }
      {
        taken.push([sx-wpx/2,top,sx+wpx/2,top+24]);
        const t1=el("text",{x:sx.toFixed(1),y:(top+10).toFixed(1),class:"lbl"+(isSel?" sel":"")});
        t1.textContent=t.n; gLabels.appendChild(t1);
        const t2=el("text",{x:sx.toFixed(1),y:(top+21).toFixed(1),class:"lbl sm"});
        t2.textContent=t.t; gLabels.appendChild(t2);
      }
    });
  }
}

const INDEX=[];
function buildIndex(){
  AREAS.forEach(a=>INDEX.push({t:a.name,s:`${a.es} · ${CHAR[a.char].label}`,k:"area",id:a.id,col:CHAR[a.char].fill,ch:a.name.charAt(0)}));
  POIS.forEach(p=>{const a=areaById(p.a);
    INDEX.push({t:p.n,s:`${CATS[p.c].label}${a?" · "+a.name:""}`,k:"poi",id:p._key,col:CATS[p.c].color,shape:CATS[p.c].shape})});
  TRIPS.forEach(t=>INDEX.push({t:t.n,s:`Day trip · ${t.t}`,k:"trip",id:t.n,col:CATS[t.c].color,shape:CATS[t.c].shape}));
}
function runSearch(q){
  const box=$("#results"); const s=q.trim().toLowerCase();
  $("#searchWrap").classList.toggle("has",!!s);
  if(!s){box.classList.remove("on");box.innerHTML="";return}
  const norm=x=>x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  const hits=INDEX.map(it=>{const n=norm(it.t);const i=n.indexOf(norm(s));
      return i<0?null:{it,r:(i===0?0:1)+(it.k==="area"?0:0.5)}}).filter(Boolean)
    .sort((a,b)=>a.r-b.r).slice(0,14).map(h=>h.it);
  box.innerHTML=hits.length?hits.map(h=>`<div class="res" data-k="${h.k}" data-id="${esc(h.id)}">
      <span class="ic" style="background:${h.col}">${h.shape?`<svg width="12" height="12" viewBox="-8 -8 16 16"><path d="${pinPath(h.shape,5.6)}" fill="#fff"/></svg>`:esc(h.ch||"")}</span>
      <div><div class="t">${esc(h.t)}</div><div class="s">${esc(h.s)}</div></div></div>`).join("")
    :`<div class="none">Nothing matches “${esc(q)}”.</div>`;
  box.classList.add("on");
  box.querySelectorAll(".res").forEach(n=>n.addEventListener("click",()=>{
    const k=n.dataset.k,id=n.dataset.id;
    if(k==="trip"){ if(state.view!=="region"){state.view="region";applyView(true)} selectTrip(id); }
    else { if(state.view!=="city"){state.view="city";applyView(true)} k==="area"?selectArea(id):selectPoi(id); }
    $("#q").value=""; runSearch("");
  }));
}

let drag=null, moved=false;
svg.addEventListener("pointerdown",e=>{
  if(e.button&&e.button!==0)return;
  drag={x:e.clientX,y:e.clientY,tx:state.tx,ty:state.ty,id:e.pointerId}; moved=false;
  svg.classList.add("drag"); svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove",e=>{
  if(!drag||drag.id!==e.pointerId)return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>4)moved=true;
  state.tx=drag.tx+dx; state.ty=drag.ty+dy; applyTransform();
});
function endDrag(e){ if(!drag)return; svg.classList.remove("drag");
  try{svg.releasePointerCapture(drag.id)}catch(_){}
  drag=null; }
svg.addEventListener("pointerup",e=>{ const wasMoved=moved; endDrag(e);
  if(!wasMoved && e.target===svg) clearSel(); });
svg.addEventListener("pointercancel",endDrag);
svg.addEventListener("wheel",e=>{
  e.preventDefault(); const r=svg.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, Math.pow(0.9985,e.deltaY*(e.deltaMode===1?18:1)));
},{passive:false});
/* pinch */
const ptrs=new Map(); let pinch=null;
svg.addEventListener("pointerdown",e=>{ptrs.set(e.pointerId,e)});
svg.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return; ptrs.set(e.pointerId,e);
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()], d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const r=svg.getBoundingClientRect(), cx=(a.clientX+b.clientX)/2-r.left, cy=(a.clientY+b.clientY)/2-r.top;
    if(pinch){ drag=null; zoomAt(cx,cy,d/pinch.d) }
    pinch={d,cx,cy};
  }
});
["pointerup","pointercancel","pointerleave"].forEach(t=>svg.addEventListener(t,e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null}));

$("#zin").addEventListener("click",()=>zoomAt(W/2,H/2,1.45));
$("#zout").addEventListener("click",()=>zoomAt(W/2,H/2,1/1.45));

$("#q").addEventListener("input",e=>runSearch(e.target.value));
$("#q").addEventListener("keydown",e=>{ if(e.key==="Escape"){e.target.value="";runSearch("")}
  if(e.key==="Enter"){const f=$("#results .res"); if(f)f.click()} });

$("#grip").addEventListener("click",()=>{
  state.panelOpen=!state.panelOpen; $("#panel").classList.toggle("open",state.panelOpen);
  paintOverlay();
});
function openSheet(){ if(window.innerWidth<=860){ state.panelOpen=true; $("#panel").classList.add("open"); } }

function applyView(keepSel){
  document.querySelectorAll("#viewtabs button").forEach(b=>b.classList.toggle("on",b.dataset.view===state.view));
  $("#filters").style.display = state.view==="city"?"flex":"none";
  $("#legend").style.display  = state.view==="city"?"block":"none";
  if(!keepSel) state.sel=null;
  if(state.view==="city") drawCity(); else drawRegion();
  state.tab="detail"; syncTabs();
  fitView(); if(state.view==="city") fitCore(); renderPanel();
}

let rt=null;
window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{
  const wx=(W/2-state.tx)/state.k, wy=(H/2-state.ty)/state.k, rel=state.k/state.fit;
  resize();
  const b=worldBBox(), availH=visibleH();
  state.fit=Math.min(W/(b.x1-b.x0), availH/(b.y1-b.y0))*(state.view==="city"?0.90:0.84);
  state.k=state.fit*rel; state.tx=W/2-wx*state.k; state.ty=H/2-wy*state.k; applyTransform();
},120)});

/* ---- boot ---- */
resize(); buildFilters(); buildLegend(); buildIndex();
drawCity(); fitView(); fitCore(); syncTabs(); renderPanel();
</script>
</body>
</html>
